codecov:
  require_ci_to_pass: yes
  notify:
    wait_for_ci: yes

coverage:
  precision: 2
  round: down
  range: "70...100"

  status:
    project:
      default:
        target: 80%
        threshold: 2%
        if_ci_failed: error
        informational: false

    patch:
      default:
        target: 75%
        threshold: 5%
        if_ci_failed: error

comment:
  layout: "reach,diff,flags,tree,files"
  behavior: default
  require_changes: false
  require_base: false
  require_head: true

ignore:
  - "tests/**/*"
  - "**/__pycache__/**/*"
  - "**/conftest.py"
  - "setup.py"
  - "sandbox/**/*"
  - "report/**/*"

flags:
  unittests:
    paths:
      - clipsai/
    carryforward: true

  integration:
    paths:
      - clipsai/
    carryforward: true

github_checks:
  annotations: true
