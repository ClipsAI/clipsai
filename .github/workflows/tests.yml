name: Tests - Extended Test Suite

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.10", "3.11"]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y ffmpeg libmagic1

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install .[dev]
        pip install pytest-cov pytest-xdist pytest-timeout

    - name: Run unit tests
      run: |
        pytest tests/ -v -m "not integration and not e2e" --cov=clipsai --cov-report=xml --cov-report=term -n auto --timeout=300
      env:
        PYTHONPATH: ${{ github.workspace }}

    - name: Upload coverage
      uses: codecov/codecov-action@v4
      if: matrix.python-version == '3.11'
      with:
        file: ./coverage.xml
        flags: unittests
        name: unit-tests-${{ matrix.python-version }}
      env:
        CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest

    steps:
